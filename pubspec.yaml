name: cirrus_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.6
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  # claude_prompt.txt (v161 -- Complete Attendance Photo Upload & Camera
  # Switching Integration §4): already present transitively (via `http`
  # itself -- confirmed via `flutter pub deps`: http_parser 4.1.2) --
  # declared directly here because `lib/services/attendance_service.dart`
  # now imports it directly, for `MediaType.parse()` on the multipart
  # photo-upload request's file part.
  http_parser: ^4.1.2
  # claude_prompt.txt (v86 -- Flutter App Attendance Integration): no
  # existing UUID capability was found anywhere in this project (confirmed
  # by grep across lib/ and pubspec.lock) -- needed for the client-generated
  # idempotency key AttendanceService.submitAttendanceEvent() persists and
  # reuses across retries.
  uuid: ^4.5.1
  # claude_prompt.txt (Complete GPS Integration for App Attendance): no
  # existing location capability was found anywhere in this project
  # (confirmed by grep across lib/ and pubspec.lock -- no geolocator/
  # location/other GPS package already present to reuse). geolocator is the
  # current maintained, actively published Flutter location package
  # (confirmed on pub.dev: latest stable 14.1.2), supporting one-time
  # foreground location on Android/iOS and the browser Geolocation API on
  # Web via its endorsed federated platform implementations, pulled in
  # transitively -- no separate geolocator_android/geolocator_web
  # dependency line is needed.
  geolocator: ^14.1.2
  # claude_prompt.txt (Update Flutter App Logo): no existing SVG-rendering
  # capability was found anywhere in this project (confirmed by grep across
  # lib/ and pubspec.lock -- flutter_svg was not already a direct or
  # transitive dependency). Needed to render the new vector logo asset via
  # `SvgPicture.asset()` as the task specifies. Version pinned to the
  # latest stable release published on pub.dev at the time of this change
  # (2.3.2, requiring Dart SDK ^3.11.0, satisfied by this project's ^3.13.7
  # constraint) -- confirmed via pub.dev, since this package was not already
  # present in the local pub cache to inspect directly.
  flutter_svg: ^2.3.2
  # claude_prompt.txt (v157 -- Flutter Camera Capture Integration): no
  # existing camera capability was found anywhere in this project (confirmed
  # by grep across lib/pubspec.lock). `camera` is the Flutter-team-maintained
  # package and is required (rather than `image_picker`) because this task's
  # own UI-state list (ready/capturing/preview/failure, distinct from the
  # OS's own camera app) needs a live, in-app `CameraController`/
  # `CameraPreview` -- `image_picker` only launches the OS camera as an
  # opaque black box and exposes none of those states. Confirmed via pub.dev
  # (fetched this round, not assumed): latest stable 0.12.2, supporting
  # Android (SDK 24+, via the camerax-based `camera_android_camerax`), iOS,
  # and Web (via `camera_web`, listed as a direct dependency of this exact
  # version -- pulled in transitively, no separate `camera_web` line needed,
  # same federated-plugin pattern this project's own `geolocator` dependency
  # above already uses and documents).
  camera: ^0.12.2
  # claude_prompt.txt (v171 -- Flutter Attendance Photo Persistence & Retry
  # Implementation): no existing filesystem-persistence capability was
  # found anywhere in this project (confirmed by grep across lib/ --
  # nothing previously wrote app-private files; SharedPreferences, used
  # everywhere else, cannot safely hold binary photo bytes). Needed for
  # `LocalPhotoStore` to persist captured photo bytes to the app's
  # documents directory (never the cache/temp directory, which the OS may
  # purge without warning -- v164's own design review, PROGRESS_LOG.md)
  # so a captured photo survives an app restart on Android. Resolved
  # version (2.1.6, pulling in path_provider_android 2.3.1 transitively,
  # confirmed via `flutter pub add`) -- not pinned to an exact version
  # beyond this project's own existing `^` convention for every other
  # direct dependency.
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # claude_prompt.txt (v161 -- Complete Attendance Photo Upload & Camera
  # Switching Integration, §9 "Use a deterministic mock camera platform
  # where practical"): both already present transitively (via `camera`
  # itself -- confirmed via `flutter pub deps`: camera_platform_interface
  # 2.15.0, cross_file 0.3.5+5) -- declared directly here, as dev-only
  # dependencies, because `test/support/fake_camera_platform.dart` imports
  # both directly to implement a fake `CameraPlatform` for widget tests;
  # `flutter_lints` flags importing a package that isn't a direct
  # dependency (`depend_on_referenced_packages`). Test-only, never shipped
  # in the app.
  camera_platform_interface: ^2.15.0
  cross_file: ^0.3.5+5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # claude_prompt.txt (Replace Android Launcher Icon with the Existing
  # Cirrus Logo): no existing icon-generation tooling was found anywhere in
  # this project (confirmed by grep across pubspec.yaml/pubspec.lock --
  # flutter_launcher_icons was not already a direct or transitive
  # dependency). Added as a dev_dependency (code-generation tooling, not
  # shipped in the app) so `dart run flutter_launcher_icons:generate` can
  # reproduce the Android launcher icons below from the same two source
  # PNGs this round already generated and committed under assets/icon/ --
  # flutter/dart tooling was unreachable in this environment (confirmed
  # again this round), so the actual android/app/.../mipmap-*/ic_launcher*
  # files were generated by hand this round and are not yet verified
  # against a real run of this tool. `ios: false` below is explicit so a
  # future run never touches the existing ios/Runner/Assets.xcassets
  # AppIcon, consistent with this task's "Android only" restriction.
  # Version pinned to the latest stable release published on pub.dev at the
  # time of this change (0.14.4, requiring Dart SDK >=3.0.0 <4.0.0,
  # satisfied by this project's ^3.13.7 constraint).
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# claude_prompt.txt (Replace Android Launcher Icon with the Existing Cirrus
# Logo): configuration for the flutter_launcher_icons dev_dependency above.
# `image_path` / `adaptive_icon_foreground` point at the two PNGs rendered
# from lib/assets/Cirrus_app_logo.svg (that SVG itself is untouched --
# "android" here only names the OUTPUT mipmap resource, matching the
# existing "ic_launcher" name AndroidManifest.xml already references, so a
# future run of this tool replaces the same files this round already wrote
# by hand rather than introducing a second icon name).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F3649"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - .env
    - lib/assets/Cirrus_app_logo.svg
    - lib/assets/cirrus_group_logo.png
    - assets/fonts/Sarabun-Regular.ttf
    - assets/fonts/Sarabun-Bold.ttf
    - assets/fonts/THSarabunPSK-Regular.ttf
    - assets/fonts/THSarabunPSK-Bold.ttf

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
