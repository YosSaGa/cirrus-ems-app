<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cirrus EMS — Technician Flow Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
      background: #f3f6f7;
      color: #102d40;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .pill {
      display: inline-block;
      background: #102d40;
      color: #32d5c0;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 700; }
    .board {
      width: 100%;
      max-width: 820px;
      background: #fafcfc;
      border: 1px solid #dfe8ec;
      border-radius: 28px;
      padding: 24px 16px;
      box-shadow: 0 10px 28px rgba(16, 45, 64, 0.06);
      display: flex;
      justify-content: center;
    }
    svg { width: 100%; max-width: 760px; height: auto; }
    .legend {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 12.5px;
      color: #536575;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="pill">CIRRUS EMS · TECHNICIAN FLOW</div>
    <h1>ผังการทำงาน Check-In / Break / Check-Out</h1>
  </div>

  <div class="board">
    <svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#1fb8a5" />
        </marker>
        <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
      </defs>

      <!-- 1. Start / Select Job -->
      <rect x="255" y="16" width="250" height="58" rx="29" fill="#102d40" />
      <text x="380" y="42" text-anchor="middle" fill="#32d5c0" font-size="13" font-weight="700">1. เลือก JOB CODE</text>
      <text x="380" y="61" text-anchor="middle" fill="#e2e8f0" font-size="12">งานของตัวเอง (Role ช่าง / Admin)</text>

      <line x1="380" y1="74" x2="380" y2="112" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- 2. Check In -->
      <rect x="245" y="116" width="270" height="60" rx="16" fill="#32d5c0" />
      <text x="380" y="143" text-anchor="middle" fill="#102d40" font-size="16" font-weight="700">CHECK IN (เริ่มงาน)</text>
      <text x="380" y="163" text-anchor="middle" fill="#102d40" font-size="12">ถ่ายรูป + บันทึก GPS</text>

      <line x1="380" y1="176" x2="380" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- 3. Working Decision -->
      <polygon points="380,220 500,272 380,324 260,272" fill="#ffffff" stroke="#102d40" stroke-width="2" />
      <text x="380" y="268" text-anchor="middle" fill="#102d40" font-size="14" font-weight="700">กำลังทำงาน</text>
      <text x="380" y="286" text-anchor="middle" fill="#536575" font-size="11.5">(ON SITE)</text>

      <!-- Left branch: BREAK -->
      <path d="M 260 272 L 165 272 L 165 344" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-warn)" />
      <text x="200" y="262" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">กดพัก</text>

      <!-- Right branch: CHECK OUT -->
      <path d="M 500 272 L 595 272 L 595 456" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />
      <text x="560" y="262" text-anchor="middle" fill="#102d40" font-size="12" font-weight="700">เลิกงาน</text>

      <!-- 4A. ON BREAK -->
      <rect x="45" y="348" width="240" height="68" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
      <text x="165" y="376" text-anchor="middle" fill="#92400e" font-size="15" font-weight="700">☕ BREAK พัก</text>
      <text x="165" y="397" text-anchor="middle" fill="#92400e" font-size="12">ขึ้นถาม "จะจบงานเลยไหม?"</text>

      <!-- From BREAK -> RESUME (loop back to Working) -->
      <path d="M 45 382 L 18 382 L 18 220 L 290 220 L 320 245" fill="none" stroke="#1fb8a5" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrow-teal)" />
      <rect x="26" y="206" width="160" height="24" rx="12" fill="#e6fbf8" stroke="#32d5c0" />
      <text x="106" y="222" text-anchor="middle" fill="#102d40" font-size="11.5" font-weight="700">▶ RESUME กลับเข้างานต่อ</text>

      <!-- From BREAK -> End Shift Now -->
      <path d="M 165 416 L 165 492 L 468 492" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-warn)" />
      <rect x="210" y="478" width="150" height="26" rx="13" fill="#fee2e2" stroke="#f87171" />
      <text x="285" y="495" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">เลือก "จบงานเลย"</text>

      <!-- 4B. CHECK OUT -->
      <rect x="472" y="460" width="246" height="64" rx="16" fill="#102d40" />
      <text x="595" y="488" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">CHECK OUT (จบงาน)</text>
      <text x="595" y="508" text-anchor="middle" fill="#32d5c0" font-size="11.5">ถ่ายรูป + GPS · หลัง 17:00 นับ OT</text>

      <!-- Down to Report -->
      <path d="M 595 524 L 595 562 L 380 562 L 380 584" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />

      <!-- 5. Mandatory Report -->
      <rect x="215" y="588" width="330" height="62" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
      <text x="380" y="615" text-anchor="middle" fill="#92400e" font-size="15" font-weight="700">📝 บังคับเขียนรายงาน</text>
      <text x="380" y="635" text-anchor="middle" fill="#92400e" font-size="12">ไม่ส่ง = ล็อก ห้ามเริ่มงานอื่นต่อ</text>

      <line x1="380" y1="650" x2="380" y2="684" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- 6. Done -->
      <rect x="240" y="688" width="280" height="56" rx="28" fill="#e3f6ea" stroke="#187647" stroke-width="2" />
      <text x="380" y="713" text-anchor="middle" fill="#14532d" font-size="15" font-weight="700">✓ เสร็จสิ้น &amp; บันทึกครบ</text>
      <text x="380" y="732" text-anchor="middle" fill="#187647" font-size="11.5">อัปเดต History + ค่าแรง + OT อัตโนมัติ</text>
    </svg>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:#32d5c0;"></i>เข้างาน / กลับเข้างาน</span>
    <span><i class="dot" style="background:#f59e0b;"></i>พักระหว่างงาน / รายงาน</span>
    <span><i class="dot" style="background:#102d40;"></i>จบงาน (Check Out)</span>
    <span><i class="dot" style="background:#187647;"></i>บันทึกเสร็จสมบูรณ์</span>
  </div>
</body>
</html>
